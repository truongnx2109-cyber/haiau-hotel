<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Khách sạn Hải Âu - Demo API</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, "Segoe UI", Arial, sans-serif; margin: 0; background: #eef3f8; color: #1f2d3d; }
  header { background: linear-gradient(135deg, #0a6cb0, #0fa3c4); color: #fff; padding: 28px 20px; text-align: center; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 6px 0 0; opacity: .9; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .card h2 { margin: 0 0 12px; font-size: 17px; color: #0a6cb0; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-right: 8px; color:#fff; }
  .get { background: #2e9e5b; } .post { background: #d9822b; }
  code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  label { display:block; font-size: 13px; margin: 8px 0 3px; font-weight:600; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { margin-top: 12px; background: #0a6cb0; color: #fff; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight:600; }
  button:hover { background: #08568c; }
  pre { background: #0f172a; color: #93f0c0; padding: 14px; border-radius: 8px; overflow:auto; font-size: 12.5px; max-height: 320px; }
  .rooms { display:grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .room { border:1px solid #e2e8f0; border-radius:10px; padding:12px; }
  .room .price { color:#0a6cb0; font-weight:700; font-size:16px; }
</style>
</head>
<body>
<header>
  <h1>🏨 Khách sạn Hải Âu — Demo API</h1>
  <p>Trang test các API JSON để nối với Smax AI</p>
</header>

<div class="wrap">

  <div class="card">
    <h2>Các loại phòng hiện có</h2>
    <div id="roomList" class="rooms">Đang tải...</div>
  </div>

  <div class="card">
    <h2><span class="badge get">GET</span> /api/availability — Kiểm tra phòng trống</h2>
    <div class="row">
      <div><label>Ngày nhận (checkin)</label><input type="date" id="av_checkin"></div>
      <div><label>Ngày trả (checkout)</label><input type="date" id="av_checkout"></div>
    </div>
    <label>Loại phòng (để trống = tất cả)</label>
    <select id="av_room"><option value="">Tất cả</option></select>
    <button onclick="checkAvailability()">Kiểm tra</button>
    <pre id="av_result">—</pre>
  </div>

  <div class="card">
    <h2><span class="badge post">POST</span> /api/bookings — Đặt phòng</h2>
    <div class="row">
      <div><label>Tên khách</label><input id="bk_ten" placeholder="Nguyễn Văn A"></div>
      <div><label>Số điện thoại</label><input id="bk_sdt" placeholder="0901234567"></div>
    </div>
    <div class="row">
      <div><label>Loại phòng</label><select id="bk_room"></select></div>
      <div><label>Số phòng</label><input type="number" id="bk_so" value="1" min="1"></div>
    </div>
    <div class="row">
      <div><label>Checkin</label><input type="date" id="bk_checkin"></div>
      <div><label>Checkout</label><input type="date" id="bk_checkout"></div>
    </div>
    <label>Ghi chú</label><input id="bk_ghichu" placeholder="(không bắt buộc)">
    <button onclick="datPhong()">Đặt phòng</button>
    <pre id="bk_result">—</pre>
  </div>

  <div class="card">
    <h2><span class="badge get">GET</span> /api/bookings/:ma_don — Tra cứu đơn</h2>
    <label>Mã đơn</label><input id="tc_ma" placeholder="HA123456...">
    <button onclick="traCuu()">Tra cứu</button>
    <button onclick="huyDon()" style="background:#c0392b">Hủy đơn</button>
    <pre id="tc_result">—</pre>
  </div>

</div>

<script>
const API = ""; // cùng origin

async function call(method, url, body) {
  const opt = { method, headers: { "Content-Type": "application/json" } };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(API + url, opt);
  return r.json();
}

async function loadRooms() {
  const data = await call("GET", "/api/rooms");
  const list = document.getElementById("roomList");
  list.innerHTML = "";
  const sel1 = document.getElementById("av_room");
  const sel2 = document.getElementById("bk_room");
  data.du_lieu.forEach(r => {
    list.innerHTML += `<div class="room"><b>${r.ten}</b><br><span class="price">${r.gia_moi_dem.toLocaleString()}đ</span>/đêm<br>
      <small>Sức chứa ${r.suc_chua} • ${r.tong_so_phong} phòng</small><br><small>${r.tien_nghi.join(", ")}</small></div>`;
    const opt = `<option value="${r.id}">${r.ten} (${r.id})</option>`;
    sel1.innerHTML += opt; sel2.innerHTML += opt;
  });
}

async function checkAvailability() {
  const ci = document.getElementById("av_checkin").value;
  const co = document.getElementById("av_checkout").value;
  const rid = document.getElementById("av_room").value;
  let url = `/api/availability?checkin=${ci}&checkout=${co}`;
  if (rid) url += `&room_id=${rid}`;
  document.getElementById("av_result").textContent = JSON.stringify(await call("GET", url), null, 2);
}

async function datPhong() {
  const body = {
    ten_khach: document.getElementById("bk_ten").value,
    sdt: document.getElementById("bk_sdt").value,
    room_id: document.getElementById("bk_room").value,
    so_phong: document.getElementById("bk_so").value,
    checkin: document.getElementById("bk_checkin").value,
    checkout: document.getElementById("bk_checkout").value,
    ghi_chu: document.getElementById("bk_ghichu").value
  };
  const res = await call("POST", "/api/bookings", body);
  document.getElementById("bk_result").textContent = JSON.stringify(res, null, 2);
  if (res.thanh_cong) document.getElementById("tc_ma").value = res.du_lieu.ma_don;
}

async function traCuu() {
  const ma = document.getElementById("tc_ma").value;
  document.getElementById("tc_result").textContent = JSON.stringify(await call("GET", "/api/bookings/" + ma), null, 2);
}
async function huyDon() {
  const ma = document.getElementById("tc_ma").value;
  document.getElementById("tc_result").textContent = JSON.stringify(await call("POST", "/api/bookings/" + ma + "/cancel"), null, 2);
}

loadRooms();
</script>
</body>
</html>
